name: 뉴스 수집

on:
  schedule:
    - cron: "7,37 * * * *" # 30분마다 (GitHub 사정으로 몇 분 늦어질 수 있음)
  workflow_dispatch: {} # Actions 탭에서 "Run workflow"로 바로 실행 가능

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 수집 도구 설치
        run: npm install --no-save --no-audit --no-fund fast-xml-parser@4.5.1

      - name: 뉴스 가져오기
        run: node scripts/collect.mjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: 결과 저장
        if: always()
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add public/data/news.json
          git diff --staged --quiet || git commit -m "뉴스 갱신 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || (git pull --rebase && git push)
