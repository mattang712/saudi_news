name: 뉴스 수집

on:
  schedule:
    - cron: "3-59/10 * * * *" # 10분마다
  workflow_dispatch: {}
  push:
    paths: ["*.zip"] # zip 파일을 올리면 바로 풀어서 적용

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 올린 zip 적용
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -gt 0 ]; then
            for z in "${zips[@]}"; do
              echo "적용: $z"
              unzip -o "$z" -x ".github/*" -d .
              git rm -q "$z"
            done
            git add -A
            git commit -q -m "업데이트 적용 (${zips[*]})"
            git push || (git pull --rebase && git push)
            # 화면 파일이 바뀐 경우에만 Vercel에 '사이트 새로 만들기' 신호 (뉴스 저장 때는 배포 안 함)
            if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
              curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" && echo "Vercel 배포 요청 완료" || echo "Vercel 배포 요청 실패"
            else
              echo "VERCEL_DEPLOY_HOOK 없음 — Vercel에서 직접 Redeploy 해 주세요"
            fi
          fi

      - name: 수집 도구 설치
        run: npm install --no-save --no-audit --no-fund fast-xml-parser@4.5.1

      - name: 뉴스 가져와서 저장
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MOFA_API_KEY: ${{ secrets.MOFA_API_KEY }}
        run: |
          for i in 1 2 3; do
            node scripts/collect.mjs || echo "수집 중 오류 — 실패 상태로 기록됨"
            git add public/data/news.json
            if git diff --staged --quiet; then
              echo "바뀐 내용 없음"; exit 0
            fi
            git commit -q -m "뉴스 갱신 $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push; then
              echo "저장 완료"; exit 0
            fi
            echo "저장소가 그 사이 바뀜 — 최신으로 맞추고 다시 시도 ($i/3)"
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"
            sleep 5
          done
          echo "3번 시도했지만 저장 실패"
          exit 1
